# Lokální vývoj: jen PostgreSQL pro Payload (port 5433 — 5432 drží ERP dev).
# Produkce běží na Vercelu s Neon Postgres — viz docs/adr/ADR-001.
# Pevné jméno projektu: volume pgdata nesmí záviset na názvu adresáře.
name: intelidome-web
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: web
      POSTGRES_PASSWORD: web
      POSTGRES_DB: intelidome_web
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web -d intelidome_web"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
